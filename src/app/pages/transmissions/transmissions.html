<p-toast />
<p-toolbar styleClass="mb-6">
    <ng-template #start>
        <p-button label="New" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="openNew()" />
        <p-button severity="secondary" label="Delete" icon="pi pi-trash" outlined (onClick)="deleteSelectedTransmissions()"
            [disabled]="!selectedTransmissions || !selectedTransmissions.length" />
    </ng-template>

    <ng-template #end>
        <p-button label="Export" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
    </ng-template>
</p-toolbar>

<p-table #dt [value]="transmissions()" [rows]="5" [paginator]="true" [lazy]="true" (onLazyLoad)="loadTransmissions($event)"
    [totalRecords]="totalRecords()" [loading]="loading()" [rowsPerPageOptions]="[5, 10, 20, 30]" [rowHover]="true"
    dataKey="id" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} transmissions"
    [showCurrentPageReport]="true" [tableStyle]="{ 'min-width': '75rem' }" [(selection)]="selectedTransmissions">
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <h5 class="m-0">Manage Transmissions</h5>
            <p-iconfield>
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText type="text" (input)="onGlobalFilter($event)" placeholder="Search..." />
            </p-iconfield>
        </div>
    </ng-template>

    <ng-template #header>
        <tr>
            <th style="width: 3rem">
                <p-tableHeaderCheckbox />
            </th>

            <th pSortableColumn="name" style="min-width: 12rem">
                Name <p-sortIcon field="name" />
            </th>

            <th pSortableColumn="gears" style="min-width: 12rem">
                Gears <p-sortIcon field="gears" />
            </th>

            <th style="min-width: 12rem"></th>
        </tr>
    </ng-template>

    <ng-template #body let-transmissions>
        <tr>
            <td style="width: 3rem">
                <p-tableCheckbox [value]="transmissions" />
            </td>

            <td style="min-width: 12rem">{{ transmissions.type }}</td>
            <td style="min-width: 12rem">{{ transmissions.gears }}</td>

            <td class="text-right">
                <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"
                    (click)="editTransmission(transmissions)" />
                <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                    (click)="deleteTransmission(transmissions)" />
            </td>
        </tr>
    </ng-template>
</p-table>

<p-dialog [(visible)]="transmissionDialog" [style]="{ width: '520px' }" header="Transmission Details" [modal]="true">
    <ng-template #content>
        <div class="flex flex-col gap-6">

            <!-- Type -->
            <div>
                <label for="code" class="block font-bold mb-3">Type</label>
                <input type="text" pInputText id="code" [(ngModel)]="transmission.type" required autofocus fluid />
                <small class="text-red-500" *ngIf="submitted && !transmission.type">Type is required.</small>
            </div>

            <!-- Gears -->
            <div>
                <label for="code" class="block font-bold mb-3">Gears</label>
                <input type="text" pInputText id="code" [(ngModel)]="transmission.gears" required autofocus fluid />
                <small class="text-red-500" *ngIf="submitted && !transmission.gears">Gears is required.</small>
            </div>

        </div>
    </ng-template>

    <ng-template #footer>
        <p-button label="Cancel" icon="pi pi-times" text (click)="hideDialog()" />
        <p-button label="Save" icon="pi pi-check" (click)="saveTransmission()" />
    </ng-template>
</p-dialog>

<p-confirmdialog [style]="{ width: '450px' }" />
