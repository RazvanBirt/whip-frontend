<p-toast />
<p-toolbar styleClass="mb-6">
    <ng-template #start>
        <p-button label="New" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="openNew()" />
        <p-button severity="secondary" label="Delete" icon="pi pi-trash" outlined (onClick)="deleteSelectedEngines()"
            [disabled]="!selectedEngines || !selectedEngines.length" />
    </ng-template>

    <ng-template #end>
        <p-button label="Export" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
    </ng-template>
</p-toolbar>

<p-table #dt [value]="engines()" [rows]="5" [paginator]="true" [lazy]="true" (onLazyLoad)="loadEngines($event)"
    [totalRecords]="totalRecords()" [loading]="loading()" [rowsPerPageOptions]="[5, 10, 20, 30]" [rowHover]="true"
    dataKey="id" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} engines"
    [showCurrentPageReport]="true" [tableStyle]="{ 'min-width': '75rem' }" [(selection)]="selectedEngines">
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <h5 class="m-0">Manage Engines</h5>
            <p-iconfield>
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText type="text" (input)="onGlobalFilter($event)" placeholder="Search..." />
            </p-iconfield>
        </div>
    </ng-template>

    <ng-template #header>
        <tr>
            <th style="width: 3rem">
                <p-tableHeaderCheckbox />
            </th>

            <th pSortableColumn="code" style="min-width: 12rem">
                Code <p-sortIcon field="code" />
            </th>

            <th pSortableColumn="configuration" style="min-width: 14rem">
                Configuration <p-sortIcon field="configuration" />
            </th>

            <th pSortableColumn="displacementCc" style="min-width: 12rem">
                Displacement (cc) <p-sortIcon field="displacementCc" />
            </th>

            <th pSortableColumn="aspiration" style="min-width: 12rem">
                Aspiration <p-sortIcon field="aspiration" />
            </th>

            <th pSortableColumn="powerPs" style="min-width: 10rem">
                Power (PS) <p-sortIcon field="powerPs" />
            </th>

            <th pSortableColumn="fuelType" style="min-width: 12rem">
                Fuel <p-sortIcon field="fuelType" />
            </th>

            <th style="min-width: 12rem"></th>
        </tr>
    </ng-template>

    <ng-template #body let-engine>
        <tr>
            <td style="width: 3rem">
                <p-tableCheckbox [value]="engine" />
            </td>

            <td style="min-width: 12rem">{{ engine.code }}</td>
            <td style="min-width: 14rem">{{ engine.configuration || '-' }}</td>
            <td style="min-width: 12rem">{{ engine.displacementCc ?? '-' }}</td>
            <td style="min-width: 12rem">{{ engine.aspiration || '-' }}</td>
            <td style="min-width: 10rem">{{ engine.powerPs ?? '-' }}</td>
            <td style="min-width: 12rem">{{ engine.fuelType || '-' }}</td>

            <td class="text-right">
                <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"
                    (click)="editEngine(engine)" />
                <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                    (click)="deleteEngine(engine)" />
            </td>
        </tr>
    </ng-template>
</p-table>

<p-dialog [(visible)]="engineDialog" [style]="{ width: '520px' }" header="Engine Details" [modal]="true">
    <ng-template #content>
        <div class="flex flex-col gap-6">

            <!-- Code -->
            <div>
                <label for="code" class="block font-bold mb-3">Code</label>
                <input type="text" pInputText id="code" [(ngModel)]="engine.code" required autofocus fluid />
                <small class="text-red-500" *ngIf="submitted && !engine.code">Code is required.</small>
            </div>

            <!-- Configuration -->
            <div>
                <label for="configuration" class="block font-bold mb-3">Configuration</label>
                <input type="text" pInputText id="configuration" [(ngModel)]="engine.configuration"
                    placeholder="e.g. Inline-4, V6, V8" fluid />
            </div>

            <!-- Displacement + Cylinders -->
            <div class="grid grid-cols-12 gap-4">
                <div class="col-span-6">
                    <label for="displacementCc" class="block font-bold mb-3">Displacement (cc)</label>
                    <p-inputnumber id="displacementCc" [(ngModel)]="engine.displacementCc" [useGrouping]="true"
                        [min]="0" fluid />
                </div>

                <div class="col-span-6">
                    <label for="cylinders" class="block font-bold mb-3">Cylinders</label>
                    <p-inputnumber id="cylinders" [(ngModel)]="engine.cylinders" [min]="0" fluid />
                </div>
            </div>

            <!-- Aspiration + Fuel -->
            <div class="grid grid-cols-12 gap-4">
                <div class="col-span-6">
                    <label for="aspiration" class="block font-bold mb-3">Aspiration</label>
                    <input type="text" pInputText id="aspiration" [(ngModel)]="engine.aspiration"
                        placeholder="e.g. NA, Turbo, Twin-Turbo, Supercharged" fluid />
                </div>

                <div class="col-span-6">
                    <label for="fuelType" class="block font-bold mb-3">Fuel Type</label>
                    <p-select id="fuelType" [(ngModel)]="engine.fuelType" [options]="fuelTypeOptions"
                        optionLabel="label" optionValue="value" placeholder="Select fuel" [showClear]="true" fluid />
                </div>
            </div>

            <!-- Power -->
            <div class="grid grid-cols-12 gap-4">
                <div class="col-span-6">
                    <label for="powerPs" class="block font-bold mb-3">Power (PS)</label>
                    <p-inputnumber id="powerPs" [(ngModel)]="engine.powerPs" [min]="0" fluid />
                </div>

                <div class="col-span-6">
                    <label for="powerKw" class="block font-bold mb-3">Power (kW)</label>
                    <p-inputnumber id="powerKw" [(ngModel)]="engine.powerKw" [min]="0" fluid />
                </div>
            </div>

            <!-- Torque -->
            <div class="grid grid-cols-12 gap-4">
                <div class="col-span-6">
                    <label for="torqueNm" class="block font-bold mb-3">Torque (Nm)</label>
                    <p-inputnumber id="torqueNm" [(ngModel)]="engine.torqueNm" [min]="0" fluid />
                </div>

                <div class="col-span-6">
                    <label for="torqueLbft" class="block font-bold mb-3">Torque (lb-ft)</label>
                    <p-inputnumber id="torqueLbft" [(ngModel)]="engine.torqueLbft" [min]="0" fluid />
                </div>
            </div>

        </div>
    </ng-template>

    <ng-template #footer>
        <p-button label="Cancel" icon="pi pi-times" text (click)="hideDialog()" />
        <p-button label="Save" icon="pi pi-check" (click)="saveEngine()" />
    </ng-template>
</p-dialog>

<p-confirmdialog [style]="{ width: '450px' }" />
