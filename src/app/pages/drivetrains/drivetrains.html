<p-toast />
<p-toolbar styleClass="mb-6">
    <ng-template #start>
        <p-button label="New" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="openNew()" />
        <p-button severity="secondary" label="Delete" icon="pi pi-trash" outlined (onClick)="deleteSelectedDrivetrains()"
            [disabled]="!selectedDrivetrains || !selectedDrivetrains.length" />
    </ng-template>

    <ng-template #end>
        <p-button label="Export" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
    </ng-template>
</p-toolbar>

<p-table #dt [value]="drivetrains()" [rows]="5" [paginator]="true" [lazy]="true" (onLazyLoad)="loadDrivetrains($event)"
    [totalRecords]="totalRecords()" [loading]="loading()" [rowsPerPageOptions]="[5, 10, 20, 30]" [rowHover]="true"
    dataKey="id" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} drivetrains"
    [showCurrentPageReport]="true" [tableStyle]="{ 'min-width': '75rem' }" [(selection)]="selectedDrivetrains">
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <h5 class="m-0">Manage Drivetrains</h5>
            <p-iconfield>
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText type="text" (input)="onGlobalFilter($event)" placeholder="Search..." />
            </p-iconfield>
        </div>
    </ng-template>

    <ng-template #header>
        <tr>
            <th style="width: 3rem">
                <p-tableHeaderCheckbox />
            </th>

            <th pSortableColumn="type" style="min-width: 12rem">
                Type <p-sortIcon field="type" />
            </th>

            <th pSortableColumn="description" style="min-width: 12rem">
                Description <p-sortIcon field="description" />
            </th>

            <th style="min-width: 12rem"></th>
        </tr>
    </ng-template>

    <ng-template #body let-drivetrains>
        <tr>
            <td style="width: 3rem">
                <p-tableCheckbox [value]="drivetrains" />
            </td>

            <td style="min-width: 12rem">{{ drivetrains.type }}</td>
            <td style="min-width: 12rem">{{ drivetrains.description }}</td>
            <td class="text-right">
                <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"
                    (click)="editDrivetrain(drivetrains)" />
                <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                    (click)="deleteDrivetrain(drivetrains)" />
            </td>
        </tr>
    </ng-template>
</p-table>

<p-dialog [(visible)]="drivetrainDialog" [style]="{ width: '520px' }" header="Drivetrain Details" [modal]="true">
    <ng-template #content>
        <div class="flex flex-col gap-6">

            <!-- Type -->
            <div>
                <label for="code" class="block font-bold mb-3">Type</label>
                <input type="text" pInputText id="code" [(ngModel)]="drivetrain.type" required autofocus fluid />
                <small class="text-red-500" *ngIf="submitted && !drivetrain.type">Type is required.</small>
            </div>

            <!-- Description -->
            <div>
                <label for="code" class="block font-bold mb-3">Description</label>
                <input type="text" pInputText id="code" [(ngModel)]="drivetrain.description" required autofocus fluid />
                <small class="text-red-500" *ngIf="submitted && !drivetrain.description">Description is required.</small>
            </div>

        </div>
    </ng-template>

    <ng-template #footer>
        <p-button label="Cancel" icon="pi pi-times" text (click)="hideDialog()" />
        <p-button label="Save" icon="pi pi-check" (click)="saveDrivetrain()" />
    </ng-template>
</p-dialog>

<p-confirmdialog [style]="{ width: '450px' }" />
