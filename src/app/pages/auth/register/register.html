<app-floating-configurator />
<p-toast />

<div class="min-h-screen bg-surface-50 dark:bg-surface-950 flex">
    <div class="hidden lg:flex flex-1 bg-surface-900 text-white p-12 flex-col justify-between">
        <a routerLink="/" class="flex items-center gap-3 text-white no-underline">
            <div class="w-11 h-11 rounded-2xl bg-primary text-white flex items-center justify-center font-bold text-xl">
                W
            </div>
            <span class="text-2xl font-bold">Whip</span>
        </a>

        <div>
            <p class="uppercase tracking-widest text-white/60 font-semibold mb-4">
                Start your garage
            </p>

            <h1 class="text-5xl font-bold leading-tight mb-6">
                Create your Whip account.
            </h1>

            <p class="text-xl text-white/70 max-w-xl">
                Save your cars, manage specs, and build your personal car dashboard.
            </p>
        </div>

        <div class="text-white/70">
            Already registered?
            <a routerLink="/auth/login" class="text-white font-semibold ml-1">
                Login
            </a>
        </div>
    </div>

    <div class="flex-1 flex items-center justify-center p-6">
        <div class="w-full max-w-md">
            <div class="mb-8 flex items-center justify-between">
                <a routerLink="/" class="flex items-center gap-3 no-underline lg:hidden">
                    <div class="w-10 h-10 rounded-2xl bg-primary text-white flex items-center justify-center font-bold">
                        W
                    </div>
                    <span class="text-surface-900 dark:text-surface-0 text-2xl font-bold">
                        Whip
                    </span>
                </a>

                <a routerLink="/" class="text-primary font-medium no-underline">
                    Back to home
                </a>
            </div>

            <div class="bg-surface-0 dark:bg-surface-900 rounded-3xl shadow p-8">
                <div class="mb-8">
                    <p class="text-primary font-semibold mb-2">Register</p>

                    <h2 class="text-surface-900 dark:text-surface-0 text-3xl font-bold mb-2">
                        Create account
                    </h2>

                    <p class="text-muted-color m-0">
                        Join Whip and create your first garage.
                    </p>
                </div>

                <label for="email" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">
                    Email
                </label>

                <input pInputText id="email" type="email" placeholder="you@example.com" class="w-full mb-4"
                    [(ngModel)]="email" />

                <label for="password" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">
                    Password
                </label>

                <p-password id="password" [(ngModel)]="password" placeholder="Password" [toggleMask]="true"
                    [feedback]="true" styleClass="w-full mb-4" inputStyleClass="w-full" (keydown)="onEnter($event)" />

                <div class="flex items-start gap-2 mb-8">
                    <p-checkbox [(ngModel)]="checked" binary inputId="terms" />

                    <label for="terms" class="text-surface-700 dark:text-surface-300 leading-relaxed">
                        I agree to create a Whip account.
                    </label>
                </div>

                <button pButton pRipple label="Create account" class="w-full mb-6" [loading]="loading"
                    (click)="onRegister()"></button>

                <div class="text-center text-surface-600 dark:text-surface-300">
                    Already have an account?
                    <a routerLink="/auth/login" class="text-primary font-semibold no-underline ml-1">
                        Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
