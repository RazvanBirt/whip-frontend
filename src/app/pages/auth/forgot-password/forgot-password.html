`
<app-floating-configurator />

<p-toast />

<div
    class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-col items-center justify-center">
        <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20 rounded-2xl shadow">
            <div class="mb-8">
                <p class="text-primary font-semibold mb-2">Password recovery</p>

                <h2 class="text-surface-900 dark:text-surface-0 text-3xl font-bold mb-2">
                    Forgot your password?
                </h2>

                <p class="text-muted-color m-0">
                    Enter your email and we’ll send you a reset link.
                </p>
            </div>

            <div>
                <label for="email" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">
                    Email
                </label>

                <input pInputText id="email" type="email" placeholder="Email address" class="w-full mb-8"
                    [(ngModel)]="email" (keydown)="onEnter($event)" />

                <p-button label="Send reset link" styleClass="w-full mb-4" [loading]="loading" (onClick)="onSubmit()" />

                <div class="flex items-center justify-between">
                    <a routerLink="/" class="text-primary font-medium no-underline">
                        Back to home
                    </a>

                    <a routerLink="/auth/login" class="text-primary font-medium no-underline">
                        Back to login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
`
